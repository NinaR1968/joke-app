<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFE15A">
<meta name="description" content="כותבים נושא, לוחצים, וצוחקים. אפליקציית תרגול של קורס 53500.">
<title>בדיחה בלחיצה</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Playpen+Sans+Hebrew:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sun:#FFE15A;      /* background */
    --ink:#2B1E4A;      /* text, outlines and hard shadows */
    --ink-soft:#4A3D6B;
    --paper:#FFFFFF;    /* input, bubble and cards */
    --red:#F23D2F;      /* the big button */
    --blue:#2E9BFF; --pink:#FF5FA8; --mint:#1FCB8C; --grape:#8B5CF6;
    --ok:#0B7A54;
    --bad:#C0261B; --bad-soft:#FFE8EC;
    --ui:"Fredoka","Rubik",system-ui,sans-serif;
    --joke:"Playpen Sans Hebrew","Fredoka",system-ui,sans-serif;
    color-scheme: light;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:var(--ui); color:var(--ink); min-height:100dvh;
    display:flex; flex-direction:column; padding:calc(14px + env(safe-area-inset-top)) 18px 20px;
    /* a few doodles at the top edges, comic halftone dots everywhere */
    background:url("/assets/bg-doodles.svg") top center / 440px 230px no-repeat,
               url("/assets/bg-dots.svg") 0 0 / 16px 16px repeat,
               var(--sun);
  }
  main { width:100%; max-width:440px; margin:0 auto; flex:1; display:flex; flex-direction:column; gap:14px; }

  .logo { display:flex; justify-content:center; }
  .logo img { width:min(300px, 80vw); height:auto; display:block; }
  .sub { text-align:center; font-size:17px; font-weight:500; color:var(--ink-soft); margin-top:-6px; text-wrap:balance; }

  form { display:flex; flex-direction:column; gap:8px; margin-top:4px; }
  label { font-size:18px; font-weight:600; }
  input {
    width:100%; font:inherit; font-size:19px; font-weight:500; padding:13px 16px; color:var(--ink);
    background:var(--paper); border:3px solid var(--ink); border-radius:18px; box-shadow:4px 4px 0 var(--ink);
    transform:rotate(.6deg);
  }
  input::placeholder { color:#756B92; }
  input:focus-visible, button:focus-visible { outline:4px solid var(--blue); outline-offset:3px; }
  button { font:inherit; cursor:pointer; }

  /* The big push button: it really goes down when you press it */
  .go {
    margin-top:10px; width:100%; min-height:64px; font-size:24px; font-weight:700; color:#FFFFFF;
    background:var(--red); border:3px solid var(--ink); border-radius:999px;
    box-shadow:0 8px 0 var(--ink); transform:rotate(-1deg); transition:transform .08s, box-shadow .08s;
    text-shadow:0 2px 0 rgba(43,30,74,.35);
  }
  .go:active, .go[disabled] { transform:rotate(-1deg) translateY(6px); box-shadow:0 2px 0 var(--ink); }
  button[disabled] { cursor:wait; }

  /* The joke bubble. data-state is idle, think, joke or error */
  .stage {
    position:relative; margin-top:22px; background:var(--paper); border:3px solid var(--ink); border-radius:28px;
    box-shadow:6px 6px 0 var(--ink); padding:22px 20px; min-height:190px; transform:rotate(-1.2deg);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center;
  }
  .msg { font-size:18px; font-weight:500; color:var(--ink-soft); max-width:30ch; }
  .stage[data-state="joke"] { align-items:stretch; justify-content:flex-start; text-align:start; padding-top:46px; }
  .stage[data-state="joke"] .msg { font-family:var(--joke); font-size:25px; line-height:1.55; color:var(--ink); max-width:none; white-space:pre-wrap; }
  .stage[data-state="error"] { background:var(--bad-soft); }
  .stage[data-state="error"] .msg { color:var(--bad); font-weight:600; }

  /* Under the joke: where it came from, and the laugh button */
  .meta { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:6px; font-size:14px; font-weight:500; color:var(--ink-soft); }
  .meta[hidden] { display:none; }
  .laugh {
    min-height:42px; padding:6px 18px; font-size:17px; font-weight:700; color:var(--ink);
    background:var(--sun); border:3px solid var(--ink); border-radius:999px; box-shadow:0 4px 0 var(--ink); transform:rotate(-2deg);
  }
  .laugh:active { transform:rotate(-2deg) translateY(3px); box-shadow:0 1px 0 var(--ink); }
  .laugh[disabled] { cursor:default; background:var(--paper); color:var(--ok); border-color:var(--ok); box-shadow:none; }

  /* The mascot: four pictures in assets/, one shown per state */
  .mascot { width:118px; }
  .mascot img { display:none; width:100%; height:auto; }
  .stage[data-state="idle"] .m-idle, .stage[data-state="think"] .m-think,
  .stage[data-state="joke"] .m-joke, .stage[data-state="error"] .m-error { display:block; }
  .stage[data-state="joke"] .mascot { position:absolute; top:-46px; inset-inline-start:-14px; width:86px; transform:rotate(8deg); }

  @keyframes bob { 50% { transform:translateY(-5px); } }
  @keyframes squash { 0%,100% { transform:scaleY(1); } 50% { transform:scaleY(.86); } }
  @keyframes giggle { 0%,100% { transform:rotate(8deg); } 25% { transform:rotate(-2deg); } 75% { transform:rotate(14deg); } }
  @keyframes wobble { 0%,100% { transform:rotate(-6deg); } 50% { transform:rotate(6deg); } }
  .stage[data-state="idle"] .mascot { animation:bob 2.4s ease-in-out infinite; }
  .stage[data-state="think"] .m-think { transform-origin:50% 90%; animation:squash .5s ease-in-out infinite; }
  .stage[data-state="joke"] .mascot { animation:giggle .35s ease-in-out 4; }
  .stage[data-state="error"] .mascot { animation:wobble 1.2s ease-in-out 2; }
  @media (prefers-reduced-motion: reduce) { .mascot, .mascot img { animation:none !important; } }

  /* The top list: ranked sticker cards */
  h2 { font-size:24px; font-weight:700; margin-top:16px; }
  ol.top { list-style:none; display:flex; flex-direction:column; gap:12px; counter-reset:rank; margin-top:8px; }
  ol.top li {
    position:relative; counter-increment:rank; background:var(--paper); border:3px solid var(--ink); border-radius:18px;
    box-shadow:4px 4px 0 var(--ink); padding:12px 14px; padding-inline-start:56px;
    font-family:var(--joke); font-size:18px; line-height:1.5;
  }
  ol.top li:nth-child(odd) { transform:rotate(-.7deg); }
  ol.top li:nth-child(even) { transform:rotate(.7deg); }
  ol.top li::before {
    content:counter(rank); position:absolute; inset-inline-start:12px; top:12px; width:32px; height:32px;
    display:grid; place-items:center; border:3px solid var(--ink); border-radius:50%;
    font-family:var(--ui); font-size:16px; font-weight:700; color:#FFFFFF; background:var(--grape);
  }
  ol.top li:nth-child(1)::before { background:var(--red); }
  ol.top li:nth-child(2)::before { background:var(--blue); }
  ol.top li:nth-child(3)::before { background:var(--mint); }
  ol.top li b { display:block; font-family:var(--ui); font-size:14px; color:var(--ink-soft); margin-top:4px; font-weight:600; }
  ol.top li.muted { padding-inline-start:14px; font-family:var(--ui); font-size:16px; color:var(--ink-soft); }
  ol.top li.muted::before { display:none; }

  footer { text-align:center; font-size:13px; font-weight:500; color:var(--ink-soft); margin-top:22px; }

  /* Account button: a white sticker in the top left corner */
  main { position:relative; }
  .account {
    position:absolute; top:0; left:0; z-index:2; display:flex; align-items:center; gap:8px;
    min-height:42px; max-width:46%; padding:4px 14px 4px 6px; font-size:16px; font-weight:600; color:var(--ink);
    background:var(--paper); border:3px solid var(--ink); border-radius:999px; box-shadow:3px 3px 0 var(--ink); transform:rotate(-2deg);
  }
  .account[hidden] { display:none; }
  .account.guest { padding:4px 16px; }
  .account .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .avatar {
    flex:none; width:30px; height:30px; display:grid; place-items:center; border:2.5px solid var(--ink); border-radius:50%;
    background:var(--grape); color:#FFFFFF; font-size:15px; font-weight:700;
  }
  .avatar.big { width:56px; height:56px; font-size:26px; border-width:3px; }
  .logo { padding-top:30px; }

  /* Dialogs: rise from the bottom on a phone, centered on a computer */
  dialog {
    width:min(440px, 100%); max-width:100%; margin:auto auto 0; padding:0; color:var(--ink); background:var(--paper);
    border:3px solid var(--ink); border-radius:26px 26px 0 0; border-bottom:none; box-shadow:0 -6px 0 var(--ink);
  }
  dialog[open] { animation:rise .22s ease-out; }
  dialog::backdrop { background:rgba(43,30,74,.45); }
  @keyframes rise { from { transform:translateY(40px); opacity:0; } }
  @media (min-width:600px) {
    dialog { margin:auto; border-radius:26px; border-bottom:3px solid var(--ink); box-shadow:6px 6px 0 var(--ink); }
  }
  @media (prefers-reduced-motion: reduce) { dialog[open] { animation:none; } }
  .sheet { padding:20px 20px calc(22px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:12px; }
  .sheet-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .sheet-head h2 { margin:0; font-size:22px; }
  .x { width:40px; height:40px; font-size:22px; font-weight:700; line-height:1; color:var(--ink); background:var(--paper); border:2.5px solid var(--ink); border-radius:50%; }
  .tabs { display:flex; gap:6px; padding:5px; border:3px solid var(--ink); border-radius:999px; background:var(--sun); }
  .tabs button { flex:1; min-height:40px; font-size:17px; font-weight:700; color:var(--ink); background:transparent; border:0; border-radius:999px; }
  .tabs button[aria-selected="true"] { background:var(--ink); color:#FFFFFF; }
  .sheet form { margin:0; gap:6px; }
  .sheet label { font-size:16px; margin-top:4px; }
  .sheet input { font-size:17px; padding:11px 14px; transform:none; box-shadow:3px 3px 0 var(--ink); }
  .field[hidden] { display:none; }
  .field { display:flex; flex-direction:column; gap:6px; }
  .note { min-height:1.4em; font-size:15px; font-weight:600; color:var(--bad); }
  .note.ok { color:var(--ok); }
  .btn {
    min-height:52px; font-size:19px; font-weight:700; color:#FFFFFF; background:var(--red);
    border:3px solid var(--ink); border-radius:999px; box-shadow:0 5px 0 var(--ink); margin-top:6px;
  }
  .btn:active { transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }
  .btn.plain { color:var(--ink); background:var(--paper); }
  .btn.danger { color:var(--bad); background:var(--bad-soft); border-color:var(--bad); box-shadow:0 5px 0 var(--bad); }
  .who { display:flex; align-items:center; gap:12px; }
  .who b { display:block; font-size:20px; }
  .who span { font-size:15px; color:var(--ink-soft); word-break:break-all; }
</style>
</head>
<body>
<main>
  <button id="account" class="account guest" type="button" hidden>כניסה</button>
  <h1 class="logo"><img src="/assets/logo.svg" alt="בדיחה בלחיצה" width="300" height="158"></h1>
  <p class="sub">כותבים נושא, לוחצים, וצוחקים. בלי נושא, מקבלים בדיחה כללית.</p>

  <form id="form">
    <label for="topic">על מה הבדיחה?</label>
    <input id="topic" name="topic" type="text" maxlength="100" placeholder="למשל: חתולים" autocomplete="off" enterkeyhint="send">
    <button id="go" class="go" type="submit">תנו לי בדיחה!</button>
  </form>

  <section id="stage" class="stage" data-state="idle">
    <div class="mascot" aria-hidden="true">
      <img class="m-idle" src="/assets/mascot-idle.svg" alt="">
      <img class="m-think" src="/assets/mascot-think.svg" alt="">
      <img class="m-joke" src="/assets/mascot-joke.svg" alt="">
      <img class="m-error" src="/assets/mascot-error.svg" alt="">
    </div>
    <p id="msg" class="msg" aria-live="polite">לוחצים על הכפתור, והבדיחה מופיעה כאן</p>
    <div id="meta" class="meta" hidden></div>
  </section>

  <section aria-labelledby="topTitle">
    <h2 id="topTitle">הכי מצחיקות</h2>
    <ol id="top" class="top"><li class="muted">טוען...</li></ol>
  </section>
</main>
<footer>מיישם AI ואוטומציה · 53500</footer>

<dialog id="loginDialog" aria-labelledby="loginTitle">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="loginTitle">כניסה</h2>
      <button class="x" type="button" data-close aria-label="סגירה">×</button>
    </div>
    <div class="tabs" role="tablist">
      <button id="tabIn" type="button" role="tab" aria-selected="true">כניסה</button>
      <button id="tabUp" type="button" role="tab" aria-selected="false">הרשמה</button>
    </div>
    <form id="loginForm" novalidate>
      <div id="nameField" class="field" hidden>
        <label for="authName">איך לקרוא לך?</label>
        <input id="authName" type="text" maxlength="30" autocomplete="nickname" placeholder="למשל: נועה">
      </div>
      <div class="field">
        <label for="authEmail">מייל</label>
        <input id="authEmail" type="email" dir="ltr" autocomplete="email" inputmode="email" required>
      </div>
      <div class="field">
        <label for="authPass">סיסמה</label>
        <input id="authPass" type="password" dir="ltr" minlength="6" autocomplete="current-password" required>
      </div>
      <p id="loginNote" class="note" role="alert"></p>
      <button id="loginBtn" class="btn" type="submit">כניסה</button>
    </form>
  </div>
</dialog>

<dialog id="meDialog" aria-labelledby="meTitle">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="meTitle">החשבון שלי</h2>
      <button class="x" type="button" data-close aria-label="סגירה">×</button>
    </div>
    <div class="who">
      <span id="meAvatar" class="avatar big" aria-hidden="true"></span>
      <div><b id="meName"></b><span id="meEmail"></span></div>
    </div>
    <p id="meNote" class="note" role="alert"></p>
    <button id="signOutBtn" class="btn plain" type="button">התנתקות</button>
    <button id="deleteBtn" class="btn danger" type="button">מחיקת החשבון</button>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"
        integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R"
        crossorigin="anonymous"></script>
<script src="/auth.js"></script>
<script>
  // The page never reads or writes a table. Data comes only from our own backend under /api.
  // Supabase is used here only through auth.js, for signing in (/auth/v1).
  const form = document.getElementById('form');
  const topicInput = document.getElementById('topic');
  const btn = document.getElementById('go');
  const stage = document.getElementById('stage');
  const msg = document.getElementById('msg');
  const meta = document.getElementById('meta');
  const topList = document.getElementById('top');

  // Which jokes this device already laughed at (a convenience, not security)
  const LKEY = 'joke-app.laughed';
  let laughed = [];
  try { laughed = JSON.parse(localStorage.getItem(LKEY) || '[]'); } catch {}
  const remember = (id) => { laughed.push(id); try { localStorage.setItem(LKEY, JSON.stringify(laughed.slice(-200))); } catch {} };

  // Every call to /api sends the token, if there is one.
  // A token the server does not know (401 + auth_required): sign out here too.
  async function call(url, options = {}) {
    const token = window.Auth ? await Auth.token() : null;
    const headers = new Headers(options.headers || {});
    if (token) headers.set('Authorization', 'Bearer ' + token);
    const res = await fetch(url, { ...options, headers });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      if (res.status === 401 && data.code === 'auth_required' && token) {
        await Auth.signOut().catch(() => {});
        throw new Error('צריך להתחבר שוב');
      }
      throw new Error(data.error || 'משהו השתבש. נסו שוב.');
    }
    return data;
  }

  // One place that switches the bubble between its four states: idle, think, joke, error
  function show(state, text) {
    stage.dataset.state = state;
    msg.textContent = text; // textContent, never innerHTML: the text came from outside
    meta.hidden = true;
    meta.replaceChildren();
  }

  function busy(on, label) {
    btn.disabled = on;
    if (on) show('think', label);
  }

  function showJoke(text, { id = null, author = null } = {}) {
    show('joke', text);
    const from = document.createElement('span');
    from.textContent = author ? 'נכתבה עכשיו בשבילך, ' + author : 'נכתבה עכשיו';
    meta.append(from);

    if (id) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'laugh';
      const done = laughed.includes(id);
      b.textContent = done ? 'צחקתם' : 'צחקתי';
      b.disabled = done;
      b.addEventListener('click', async () => {
        b.disabled = true;
        try {
          const r = await call('/api/laugh', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
          remember(id);
          b.textContent = 'צחקתם · ' + r.laughs;
          loadTop();
        } catch (err) {
          b.disabled = false;
          from.textContent = err.message;
        }
      });
      meta.append(b);
    }
    meta.hidden = false;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const topic = topicInput.value.trim();
    btn.textContent = 'חושב...';
    busy(true, topic ? 'מחפש בדיחה על ' + topic + '...' : 'מחפש בדיחה...');
    try {
      const data = await call('/api/joke', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ topic }) });
      showJoke(data.joke, { id: data.id, author: data.author_name });
      btn.textContent = 'עוד בדיחה!';
    } catch (err) {
      show('error', err.message);
      btn.textContent = 'לנסות שוב';
    } finally {
      busy(false);
    }
  });

  async function loadTop() {
    try {
      const { jokes } = await call('/api/top');
      topList.replaceChildren();
      if (!jokes.length) {
        const li = document.createElement('li');
        li.className = 'muted';
        li.textContent = 'עוד אין. צחקו על בדיחה, והיא תופיע כאן.';
        topList.append(li);
        return;
      }
      for (const j of jokes) {
        const li = document.createElement('li');
        li.textContent = j.text;
        const b = document.createElement('b');
        b.textContent = (j.laughs === 1 ? 'צחוק אחד' : j.laughs + ' צחוקים') + (j.topic ? ' · ' + j.topic : '');
        li.append(b);
        topList.append(li);
      }
    } catch (err) {
      topList.replaceChildren();
      const li = document.createElement('li');
      li.className = 'muted';
      li.textContent = err.message;
      topList.append(li);
    }
  }
  loadTop();

  // ---------- Account: button, sign-in dialog, "my account" dialog ----------
  const accountBtn = document.getElementById('account');
  const loginDialog = document.getElementById('loginDialog');
  const meDialog = document.getElementById('meDialog');
  const loginForm = document.getElementById('loginForm');
  const loginTitle = document.getElementById('loginTitle');
  const tabIn = document.getElementById('tabIn');
  const tabUp = document.getElementById('tabUp');
  const nameField = document.getElementById('nameField');
  const authName = document.getElementById('authName');
  const authEmail = document.getElementById('authEmail');
  const authPass = document.getElementById('authPass');
  const loginNote = document.getElementById('loginNote');
  const loginBtn = document.getElementById('loginBtn');
  const meNote = document.getElementById('meNote');
  const signOutBtn = document.getElementById('signOutBtn');
  const deleteBtn = document.getElementById('deleteBtn');
  let mode = 'in'; // 'in' = sign in, 'up' = sign up

  function note(el, text, ok = false) {
    el.textContent = text;
    el.classList.toggle('ok', ok);
  }

  function initial(name) {
    return Array.from(name || '?')[0].toUpperCase();
  }

  function renderAccount() {
    const u = Auth.user();
    accountBtn.replaceChildren();
    accountBtn.classList.toggle('guest', !u);
    if (!u) {
      accountBtn.textContent = 'כניסה';
      accountBtn.setAttribute('aria-label', 'כניסה או הרשמה');
      return;
    }
    const av = document.createElement('span');
    av.className = 'avatar';
    av.setAttribute('aria-hidden', 'true');
    av.textContent = initial(u.name);
    const nm = document.createElement('span');
    nm.className = 'name';
    nm.textContent = u.name;
    accountBtn.append(av, nm);
    accountBtn.setAttribute('aria-label', 'החשבון שלי: ' + u.name);
  }

  function setMode(next) {
    mode = next;
    const up = mode === 'up';
    tabIn.setAttribute('aria-selected', String(!up));
    tabUp.setAttribute('aria-selected', String(up));
    nameField.hidden = !up;
    loginTitle.textContent = up ? 'הרשמה' : 'כניסה';
    loginBtn.textContent = up ? 'הרשמה' : 'כניסה';
    authPass.autocomplete = up ? 'new-password' : 'current-password';
    note(loginNote, '');
  }
  tabIn.addEventListener('click', () => setMode('in'));
  tabUp.addEventListener('click', () => setMode('up'));

  function openLogin(text = '') {
    setMode('in');
    loginForm.reset();
    note(loginNote, text, true);
    loginDialog.showModal();
  }

  function openMe() {
    const u = Auth.user();
    if (!u) return openLogin();
    document.getElementById('meAvatar').textContent = initial(u.name);
    document.getElementById('meName').textContent = u.name;
    document.getElementById('meEmail').textContent = u.email;
    note(meNote, '');
    meDialog.showModal();
  }

  accountBtn.addEventListener('click', () => (Auth.user() ? openMe() : openLogin()));

  // Close with Escape (built in), with the × button, or by clicking outside the sheet
  for (const d of [loginDialog, meDialog]) {
    d.addEventListener('click', (e) => { if (e.target === d || e.target.closest('[data-close]')) d.close(); });
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = authEmail.value.trim();
    const password = authPass.value;
    if (mode === 'up' && !authName.value.trim()) return note(loginNote, 'איך לקרוא לך? כתבו שם.');
    if (!email || !authEmail.checkValidity()) return note(loginNote, 'כתבו כתובת מייל תקינה.');
    if (password.length < 6) return note(loginNote, 'הסיסמה קצרה מדי. צריך לפחות 6 תווים.');

    loginBtn.disabled = true;
    note(loginNote, mode === 'up' ? 'נרשמים...' : 'נכנסים...', true);
    try {
      if (mode === 'up') await Auth.signUp(authName.value, email, password);
      else await Auth.signIn(email, password);
      loginDialog.close();
      loginForm.reset();
    } catch (err) {
      note(loginNote, err.message);
    } finally {
      loginBtn.disabled = false;
    }
  });

  signOutBtn.addEventListener('click', async () => {
    signOutBtn.disabled = true;
    await Auth.signOut();
    signOutBtn.disabled = false;
    meDialog.close();
  });

  deleteBtn.addEventListener('click', async () => {
    if (!confirm('למחוק את החשבון? אי אפשר לבטל. הבדיחות שלך יישארו, בלי השם שלך.')) return;
    deleteBtn.disabled = true;
    note(meNote, 'מוחקים...', true);
    try {
      await call('/api/delete-account', { method: 'POST' });
      await Auth.signOut();
      meDialog.close();
    } catch (err) {
      note(meNote, err.message);
    } finally {
      deleteBtn.disabled = false;
    }
  });

  // Sign in is optional: if /api/config fails, the button stays hidden and everyone is a guest
  if (window.Auth) {
    Auth.ready.then(() => {
      renderAccount();
      accountBtn.hidden = false;
      Auth.onChange(renderAccount);
    }).catch(() => {});
  }

  // PWA: register the service worker so the app can be installed
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
  }
</script>
</body>
</html>
