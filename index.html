<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בדיחה בלחיצה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Playpen+Sans+Hebrew:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --sun: #FFE15A;
    --paper: #FFFFFF;
    --ink: #2B1E4A;
    --ink-soft: #4A3D6B;
    --red: #F23D2F;
    --blue: #2E9BFF;
    --error: #C0261B;
    --error-bg: #FFE8EC;
    --hint: #756B92;
    --ui: "Fredoka", system-ui, sans-serif;
    --hand: "Playpen Sans Hebrew", "Fredoka", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--sun) url("assets/bg-dots.svg");
    color: var(--ink);
    font-family: var(--ui);
  }
  .doodles {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 440px;
    max-width: 100%;
    height: 230px;
    background: url("assets/bg-doodles.svg") no-repeat center top / contain;
    pointer-events: none;
  }
  main {
    position: relative;
    max-width: 440px;
    margin: 0 auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .logo { display: block; width: 300px; max-width: 100%; margin: 0 auto; }
  .intro {
    margin: 0;
    text-align: center;
    font-size: 17px;
    font-weight: 500;
    color: var(--ink-soft);
  }
  label { font-size: 18px; font-weight: 600; }
  input {
    width: 100%;
    font: 500 19px var(--ui);
    color: var(--ink);
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 18px;
    box-shadow: 4px 4px 0 var(--ink);
    padding: 12px 16px;
    transform: rotate(0.6deg);
  }
  input::placeholder { color: var(--hint); opacity: 1; }
  input:focus { outline: 4px solid var(--blue); outline-offset: 0; }
  button {
    width: 100%;
    min-height: 64px;
    font: 700 24px var(--ui);
    color: #fff;
    background: var(--red);
    border: 3px solid var(--ink);
    border-radius: 999px;
    box-shadow: 0 8px 0 var(--ink);
    transform: rotate(-1deg);
    cursor: pointer;
    transition: transform .08s, box-shadow .08s;
  }
  button:active, button:disabled {
    transform: translateY(6px) rotate(-1deg);
    box-shadow: 0 2px 0 var(--ink);
  }
  button:disabled { cursor: wait; }
  button:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }

  .bubble {
    position: relative;
    min-height: 190px;
    margin-top: 6px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 28px;
    box-shadow: 6px 6px 0 var(--ink);
    transform: rotate(-1.2deg);
  }
  .bubble[data-state="error"] { background: var(--error-bg); }
  .mascot { width: 118px; height: auto; }
  .text { margin: 0; font-size: 16px; font-weight: 500; color: var(--ink-soft); }
  .bubble[data-state="joke"] {
    justify-content: flex-start;
    padding-top: 44px;
  }
  .bubble[data-state="joke"] .mascot {
    position: absolute;
    top: -34px;
    right: -10px;
    width: 86px;
    transform: rotate(8deg);
  }
  .bubble[data-state="joke"] .text {
    font: 500 25px/1.55 var(--hand);
    color: var(--ink);
    text-align: right;
    align-self: stretch;
  }
  .bubble[data-state="error"] .text { color: var(--error); font-weight: 600; }
  footer {
    margin-top: 10px;
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .bubble[data-state="idle"] .mascot { animation: hop 2.4s ease-in-out infinite; }
  .bubble[data-state="think"] .mascot { animation: squash .5s ease-in-out infinite; }
  .bubble[data-state="joke"] .mascot { animation: roll 1s ease-in-out 4; }
  .bubble[data-state="error"] .mascot { animation: wobble .6s ease-in-out 2; }
  @keyframes hop { 50% { transform: translateY(-5px); } }
  @keyframes squash { 50% { transform: scale(.86); } }
  @keyframes roll {
    0%, 100% { transform: rotate(8deg); }
    50% { transform: rotate(-12deg); }
  }
  @keyframes wobble {
    25% { transform: rotate(-8deg); }
    75% { transform: rotate(8deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="doodles" aria-hidden="true"></div>
<main>
  <img class="logo" src="assets/logo.svg" alt="בדיחה בלחיצה">
  <p class="intro">כותבים נושא, לוחצים, וצוחקים. בלי נושא, מקבלים בדיחה כללית.</p>

  <form id="form" autocomplete="off">
    <div style="display:flex;flex-direction:column;gap:14px">
      <label for="topic">על מה הבדיחה?</label>
      <input id="topic" name="topic" type="text" maxlength="100" placeholder="למשל: חתולים">
      <button id="go" type="submit">תנו לי בדיחה!</button>
    </div>
  </form>

  <section class="bubble" id="bubble" data-state="idle" aria-live="polite">
    <img class="mascot" id="mascot" src="assets/mascot-idle.svg" alt="">
    <p class="text" id="text">לוחצים על הכפתור, והבדיחה מופיעה כאן</p>
  </section>

  <footer>מיישם AI ואוטומציה · 53500</footer>
</main>

<script>
  const form = document.getElementById("form");
  const topicInput = document.getElementById("topic");
  const go = document.getElementById("go");
  const bubble = document.getElementById("bubble");
  const mascot = document.getElementById("mascot");
  const text = document.getElementById("text");

  const buttonLabel = { idle: "תנו לי בדיחה!", think: "חושב...", joke: "עוד בדיחה!", error: "לנסות שוב" };

  function setState(state, message) {
    bubble.dataset.state = state;
    mascot.src = `assets/mascot-${state}.svg`;
    text.textContent = message;
    go.textContent = buttonLabel[state];
    go.disabled = state === "think";
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const topic = topicInput.value.trim();
    setState("think", topic ? `מחפש בדיחה על ${topic}...` : "מחפש בדיחה...");
    try {
      const response = await fetch("/api/joke", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ topic }),
      });
      const data = await response.json();
      if (!response.ok || !data.joke) throw new Error(data.error || "שגיאה");
      setState("joke", data.joke);
    } catch (err) {
      const known = err instanceof Error && err.message && err.message !== "שגיאה" && !(err instanceof TypeError) && !(err instanceof SyntaxError);
      setState("error", known ? err.message : "משהו השתבש. נסו שוב עוד רגע.");
    }
  });
</script>
</body>
</html>
